<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ambientLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05070d" stop-opacity="1" />
    </radialGradient>

    <!-- 3D Specular Light for Central Typography -->
    <linearGradient id="text3dFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- 3D Extrusion Shadow Gradient -->
    <linearGradient id="text3dSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.6" />
    </linearGradient>

    <!-- 3D Floating Sphere Gradients -->
    <radialGradient id="sphereGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="65%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#082F49" />
    </radialGradient>

    <radialGradient id="sphereGrad2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F5D0FE" />
      <stop offset="30%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#2E1065" />
    </radialGradient>

    <!-- 3D Isometric Cube Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.85" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter for 3D Elements -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Ambient Glow for 3D Text -->
    <filter id="ambientTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38BDF8" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>

    <!-- Frosted Glass Pill Filter -->
    <filter id="glassFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes float3D {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes floatSphere {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    .floating-cube { animation: float3D 6s ease-in-out infinite; transform-origin: 780px 110px; }
    .floating-sphere-1 { animation: floatSphere 5s ease-in-out infinite; }
    .floating-sphere-2 { animation: floatSphere 7s ease-in-out infinite reverse; }
    .aura-glow { animation: pulseAura 4s ease-in-out infinite; transform-origin: 450px 105px; }
  </style>

  <!-- 3D Deep Canvas Frame -->
  <rect width="900" height="230" rx="16" fill="url(#ambientLight)" stroke="#334155" stroke-width="1" />

  <!-- Background 3D Volumetric Light Cone / Aura -->
  <ellipse cx="450" cy="115" rx="280" ry="60" fill="#38BDF8" opacity="0.12" filter="blur(40px)" class="aura-glow" />
  <ellipse cx="450" cy="115" rx="180" ry="40" fill="#818CF8" opacity="0.18" filter="blur(30px)" />

  <!-- 3D FLOATING ACCENT 1: Left Minimalist 3D Metallic Sphere -->
  <g class="floating-sphere-1" filter="url(#softShadow)">
    <!-- Ambient contact shadow on floor -->
    <ellipse cx="95" cy="175" rx="26" ry="6" fill="#000000" opacity="0.4" />
    <!-- 3D Sphere -->
    <circle cx="95" cy="120" r="28" fill="url(#sphereGrad1)" />
    <!-- 3D Specular Highlight glint -->
    <ellipse cx="86" cy="108" rx="8" ry="4" fill="#FFFFFF" opacity="0.65" transform="rotate(-25 86 108)" />
  </g>

  <!-- 3D FLOATING ACCENT 2: Right Minimalist Isometric Glass Cube -->
  <g class="floating-cube" filter="url(#softShadow)">
    <!-- Contact shadow below cube -->
    <ellipse cx="785" cy="180" rx="35" ry="8" fill="#000000" opacity="0.45" />
    <!-- Top Face -->
    <polygon points="785,75 825,95 785,115 745,95" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="745,95 785,115 785,160 745,140" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="785,115 825,95 825,140 785,160" fill="url(#cubeRight)" />
    <!-- Edge Highlight wireframes for crisp 3D definition -->
    <line x1="785" y1="75" x2="825" y2="95" stroke="#BAE6FD" stroke-width="1" opacity="0.7" />
    <line x1="785" y1="75" x2="745" y2="95" stroke="#BAE6FD" stroke-width="1" opacity="0.7" />
    <line x1="785" y1="115" x2="785" y2="160" stroke="#7DD3FC" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- Small Ambient Accent Sphere (Background depth) -->
  <g class="floating-sphere-2">
    <circle cx="705" cy="65" r="14" fill="url(#sphereGrad2)" opacity="0.7" filter="url(#softShadow)" />
    <ellipse cx="701" cy="59" rx="4" ry="2" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- TOP MINIMALIST STATUS CHIP (Frosted Glass Pill) -->
  <g transform="translate(325, 24)" filter="url(#glassFilter)">
    <rect width="250" height="26" rx="13" fill="#0F172A" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
    <!-- Live Glowing Status Dot -->
    <circle cx="16" cy="13" r="3.5" fill="#38BDF8" />
    <circle cx="16" cy="13" r="6" fill="#38BDF8" opacity="0.3">
      <animate attributeName="r" values="3.5;7;3.5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.8">
      SIH 2026 FINALIST  •  BYTEKNIGHT
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3D EXTRUDED MINIMALIST TYPOGRAPHY -->
  <!-- ========================================================================= -->
  <!-- Layer 3: Deep Ambient Drop Shadow -->
  <text x="450" y="118" text-anchor="middle" fill="#020617" opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="46" font-weight="900" letter-spacing="4">
    BHAGAT MUKHIYA
  </text>
  <!-- Layer 2: 3D Bevel Underside / Extrusion Edge -->
  <text x="450" y="116" text-anchor="middle" fill="url(#text3dSide)" opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="46" font-weight="900" letter-spacing="4">
    BHAGAT MUKHIYA
  </text>
  <!-- Layer 1: Front Face with Specular Lighting -->
  <text x="450" y="113" text-anchor="middle" fill="url(#text3dFace)" filter="url(#ambientTextGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="46" font-weight="900" letter-spacing="4">
    BHAGAT MUKHIYA
  </text>

  <!-- SUBTITLE: Refined Minimalist Monospace / Modern Sans -->
  <text x="450" y="152" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2">
    ELECTRONICS &amp; COMPUTER SCIENCE  •  EMBEDDED IoT  •  3D COMPUTING
  </text>

  <!-- Minimal 3D Floor Baseline Accent -->
  <line x1="330" y1="180" x2="570" y2="180" stroke="#334155" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="4 6" />
</svg>