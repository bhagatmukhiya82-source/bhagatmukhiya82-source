<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="25%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.5" />
    </linearGradient>

    <filter id="glowTitle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pillGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00F5D4" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .twinkle-1 { animation: twinkle 3s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 4.5s ease-in-out infinite; }
    .twinkle-3 { animation: twinkle 2.2s ease-in-out infinite; }
    .pulse-beacon { animation: pulseDot 2s ease-in-out infinite; transform-origin: 298px 37px; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="230" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Accent Pattern -->
  <g opacity="0.08" stroke="#00F5D4" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="230" />
    <line x1="200" y1="0" x2="200" y2="230" />
    <line x1="300" y1="0" x2="300" y2="230" />
    <line x1="400" y1="0" x2="400" y2="230" />
    <line x1="500" y1="0" x2="500" y2="230" />
    <line x1="600" y1="0" x2="600" y2="230" />
    <line x1="700" y1="0" x2="700" y2="230" />
    <line x1="800" y1="0" x2="800" y2="230" />
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="150" x2="900" y2="150" />
  </g>

  <!-- Twinkling Star Particles -->
  <circle cx="80" cy="40" r="2" fill="#00F5D4" class="twinkle-1" />
  <circle cx="210" cy="75" r="3" fill="#FF007A" class="twinkle-2" />
  <circle cx="720" cy="45" r="2.5" fill="#A855F7" class="twinkle-3" />
  <circle cx="830" cy="95" r="2" fill="#00D2FF" class="twinkle-1" />
  <circle cx="150" cy="170" r="2" fill="#00F5D4" class="twinkle-2" />
  <circle cx="780" cy="180" r="3" fill="#FF007A" class="twinkle-3" />

  <!-- Fluid Cyber Waves -->
  <path d="M 0,180 Q 225,130 450,175 T 900,160 L 900,230 L 0,230 Z" fill="url(#wave1)" />
  <path d="M 0,195 Q 225,160 450,190 T 900,178 L 900,230 L 0,230 Z" fill="url(#wave2)" />

  <!-- Top Pill Beacon -->
  <g filter="url(#pillGlow)">
    <rect x="275" y="24" width="350" height="28" rx="14" fill="#0b1120" stroke="#00F5D4" stroke-width="1.2" />
    <circle cx="298" cy="38" r="4.5" fill="#00F5D4" class="pulse-beacon" />
    <text x="312" y="42" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SIH 2026 FINALIST • TEAM BYTEKNIGHT</text>
  </g>

  <!-- Big Bold Neon Header Name -->
  <text x="450" y="115" text-anchor="middle" fill="url(#neonTitle)" filter="url(#glowTitle)" font-family="'Segoe UI', -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="3">
    BHAGAT MUKHIYA
  </text>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" fill="#CBD5E1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2">
    ELECTRONICS &amp; COMPUTER SCIENCE ENGINEER  |  IoT ARCHITECT  |  CREATIVE DIRECTOR
  </text>
</svg>